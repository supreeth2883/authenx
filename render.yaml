# render.yaml — Render Blueprint for AuthenX
# https://docs.render.com/blueprint-spec
#
# Deploys: cloud-api, connector, web + managed Postgres & Redis
# All services use Docker (Dockerfile.prod) from the monorepo root context.

databases:
  - name: authenx-db
    plan: free
    databaseName: authenx
    user: authenx

services:
  # ── Redis ───────────────────────────────────────────────────────
  - type: redis
    name: authenx-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []  # only internal

  # ── Cloud API (NestJS) ──────────────────────────────────────────
  - type: web
    name: authenx-cloud-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: apps/cloud-api/Dockerfile.prod
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: authenx-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: authenx-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400"
      - key: CORS_ORIGIN
        value: https://authenx-web.onrender.com
      - key: LOG_LEVEL
        value: info
      - key: CONNECTOR_URL
        value: https://authenx-connector.onrender.com

  # ── Connector (NestJS) ──────────────────────────────────────────
  - type: web
    name: authenx-connector
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: apps/connector/Dockerfile.prod
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLOUD_API_URL
        value: https://authenx-cloud-api.onrender.com
      - key: ISSUER_CODE
        value: CVR
      - key: LOG_LEVEL
        value: info

  # ── Web Frontend (Next.js) ─────────────────────────────────────
  - type: web
    name: authenx-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: apps/web/Dockerfile.prod
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXT_PUBLIC_API_URL
        value: https://authenx-cloud-api.onrender.com
      - key: API_URL
        value: https://authenx-cloud-api.onrender.com
