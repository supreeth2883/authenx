services:
  postgres:
    image: postgres:16-alpine
    container_name: authenx-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-authenx}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-authenx_local_secure_pwd_123}
      POSTGRES_DB: ${DB_NAME:-authenx}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-authenx}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - authenx-network

  redis:
    image: redis:7-alpine
    container_name: authenx-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_local_secure_pwd_123}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local_secure_pwd_123}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - authenx-network

  cloud-api:
    build:
      context: .
      dockerfile: apps/cloud-api/Dockerfile.prod
    container_name: authenx-cloud-api-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-authenx}:${DB_PASSWORD:-authenx_local_secure_pwd_123}@postgres:5432/${DB_NAME:-authenx}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_local_secure_pwd_123}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-authenx_jwt_secret_local_testing_min32chars}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      CONNECTOR_URL: http://connector:3002
    ports:
      - "3001:3001"
    networks:
      - authenx-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');h.get('http://localhost:3001/',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  connector:
    build:
      context: .
      dockerfile: apps/connector/Dockerfile.prod
    container_name: authenx-connector-prod
    restart: always
    depends_on:
      - cloud-api
    environment:
      NODE_ENV: production
      PORT: 3002
      CLOUD_API_URL: ${CLOUD_API_URL:-http://cloud-api:3001}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3002:3002"
    networks:
      - authenx-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');h.get('http://localhost:3002/',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: authenx-web-prod
    restart: always
    depends_on:
      - cloud-api
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_URL: http://cloud-api:3001
    ports:
      - "3000:3000"
    networks:
      - authenx-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');h.get('http://localhost:3000/login',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  authenx-network:
    driver: bridge
